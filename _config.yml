title: SYSU-SCC # 站点标题
description: | # 头像背后的信息（html格式），<br/>代表换行
  Student Cluster Competition Team at Sun Yat-sen University
baseurl: "" # 假如你的博客是建在某个目录下的，请在这里加上目录名，并且下面配置的所有链接里的`/assets`前也要加，即`/your_baseurl/assets`。这一项结尾不要有'/'。

defaults: # 将所有配置选项使用<https://jekyllrb.com/docs/configuration/front-matter-defaults/>功能进行配置
  - scope:
      path: "" # an empty string here means all files in the project
    values: # 以下配置项也可以在任意页面自定义
      jekyll-theme-WuK: # 我的主题的自定义样式都在这个命名空间
        comments: # 用于存储网页评论
          append: |
            <div class="giscus">
              Loading comments...
            </div>
            <script src="https://giscus.app/client.js"
              data-repo="SYSU-SCC/SYSU-SCC.github.io"
              data-repo-id="MDEwOlJlcG9zaXRvcnkzMjQzNDg0MDE="
              data-category="Announcements"
              data-category-id="DIC_kwDOE1Up8c4Co61u"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="preferred_color_scheme"
              data-lang="en"
              crossorigin="anonymous"
              async>
            </script>
        default:
          html_lang: zh # <https://www.w3school.com.cn/tags/html_ref_language_codes.asp>
          color-mode: auto # <https://primer.style/css/storybook/?path=/docs/support-theming--docs>
          light-theme: light
          dark-theme: dark
          menu:
            nav: # 导航部分的内容，你也可以自己增加文字、图标（来自fontawesome）和对应的链接
              - title: 'Index'
                href: /
              - title: 'Honors'
                href: /Honors/
              - title: 'Members'
                href: /Members/
              - title: 'Talks'
                href: /Talks/
              - title: 'Concat'
                href: /Concat/
              - title: 'GitHub'
                href: https://github.com/SYSU-SCC
            footer: |
              <div>
                (C) 2012-2025 SYSU-SCC
              </div>
            jekyll-toc: # <https://github.com/allejo/jekyll-toc>
              enable: true
              prepend: |
                <style>
                  #toc {
                    padding-left: 2em;
                  }
                </style>
            prepend:
              - |
                <form class="SelectMenu-filter">
                  <input
                    class="SelectMenu-input form-control"
                    type="text"
                    placeholder="Search"
                    aria-label="Filter"
                    id="sidebar-search-input"
                  />
                  <ol class="px-5" id="sidebar-search-results-container"></ol>
                  <script
                    src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0"
                    async="async"
                    onload='
                  SimpleJekyllSearch({
                    json: "/assets/simple-jekyll-search/search.json",
                    searchInput: document.getElementById("sidebar-search-input"),
                    resultsContainer: document.getElementById("sidebar-search-results-container"),
                    searchResultTemplate: `<li><a href="{url}">{title}</a></li>`,
                    limit: 9,
                    fuzzy: true
                  })'
                  ></script>
                </form>
          append_to_head: # 通过内嵌html的方式引入并定制插件，删改前确定知道自己在做什么。定制插件的方式可以参考这篇文章 <https://wu-kan.cn/_posts/2019-01-18-基于Jekyll搭建个人博客/>
            - | # 一些页面优化标签，看不懂可跳过
              <meta
                http-equiv="content-type"
                content="text/html; charset=utf-8"
              />
              <meta
                name="viewport"
                content="width=device-width,minimum-scale=1,initial-scale=1"
              />
              <link
                rel="alternate"
                href="/feed.xml"
                title="RSS"
                type="application/rss+xml"
              />
            - | # 来自primer/css的页面样式，不要改
              <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/@primer/css@21.5.1/dist/primer.min.css"
              />
            - | # 代码高亮，可在 <https://www.npmjs.com/package/pygments-rouge-css> 挑选
              <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/pygments-rouge-css@0.1.0/perldoc.min.css"
              />
            - | # 字体
              <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/@fontsource/monaspace-xenon@5.1.0/index.min.css"
              />
              <link
                rel='stylesheet'
                href='https://chinese-fonts-cdn.deno.dev/packages/jyhpws/dist/%E6%9E%81%E5%BD%B1%E6%AF%81%E7%89%87%E6%96%87%E5%AE%8B/result.css'
              />
              <style>
                body, .markdown-body {
                  font-family: "Monaspace Xenon", "极影毁片文宋 Medium", var(--fontStack-monospace, monospace);
                }
              </style>
            - | # 填满页面
              <style>
                #wrap-content {
                  min-height: 100vh;
                }
              </style>
        page:
          title: # 为每个页面自动生成一个 H1 title
            enable: true
          prepend:
            - | # 首行缩进2字符，图片相应调整
              <style>
                .markdown-body p {
                  text-indent: 2em;
                }
                .markdown-body img {
                  max-width: calc(100% - 4em);
                }
              </style>
            - |
              <style>
              .markdown-body .highlight pre,
              .markdown-body pre {
                  padding: 0;
                  background: none;
                }
              </style>
          plugin:
            - smart_include:
                enable: true
                key: $
              append:
                | # 对KaTeX过长公式渲染超出页面的修正，感谢[@AmachiInori](https://github.com/wu-kan/wu-kan.github.io/issues/13)
                <link
                  rel="stylesheet"
                  href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
                />
                <style>
                  .katex-display>.katex {
                    white-space: normal;
                  }
                </style>
                <script
                  src="https://cdn.jsdelivr.net/combine/npm/katex@0.16.21/dist/katex.min.js,npm/katex@0.16.21/dist/contrib/auto-render.min.js"
                  async="async"
                  onload='renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, { left: "$", right: "$", display: false }, {left: "\\(", right: "\\)", display: false}, {left: "\\[", right: "\\]", display: true}]})'
                ></script>
            - smart_include:
                enable: true
                key: language-vega-lite
              append: |
                <style>
                  pre code.language-vega-lite {
                    display: none;
                  }
                </style>
                <script
                  src="https://cdn.jsdelivr.net/combine/npm/vega@5.31.0,npm/vega-lite@5.23.0,npm/vega-embed@6.29.0"
                  async="async"
                  onload='
                    for(let x of document.getElementsByClassName("language-vega-lite"))
                      if(x.nodeName=="CODE")
                      {
                        let m = document.createElement("div");
                        x.parentNode.insertAdjacentElement("beforebegin", m);
                        vegaEmbed(m, JSON.parse(x.textContent));
                      }'
                ></script>
            - smart_include:
                enable: true
                key: language-mermaid
              append: |
                <style>
                  pre code.language-mermaid {
                    display: none;
                  }
                </style>
                <script
                  src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"
                  async="async"
                  defer="defer"
                  onload='
                    for(let x of document.getElementsByClassName("language-mermaid"))
                      if(x.nodeName=="CODE")
                      {
                        let m = document.createElement("div");
                        m.classList.add("mermaid");
                        m.textContent = x.textContent;
                        x.parentNode.insertAdjacentElement("beforebegin", m);
                      }'
                ></script>
            - smart_include:
                enable: false
              append: |
                <link
                  rel="stylesheet"
                  href="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.0/lib/sakana.min.css"
                />
                <script>
                function initSakanaWidget() {
                  const mizuno = SakanaWidget.getCharacter('takina');
                  mizuno.image = `https://mizuno-ai.wu-kan.cn/pixiv/75805052_p0.webp`;
                  SakanaWidget.registerCharacter('mizuno', mizuno);
                  let sakana = document.createElement("div");
                  sakana.style.bottom = "0";
                  sakana.style.right = "0";
                  sakana.style.zIndex = "1";
                  sakana.style.position = "fixed";
                  document.body.insertAdjacentElement("beforeend", sakana);
                  new SakanaWidget({ character: 'mizuno' }).mount(sakana);
                }
                </script>
                <script
                  async
                  onload="initSakanaWidget();"
                  src="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.0/lib/sakana.min.js"
                ></script>
        post:
          date: # 显示博文时间
            enable: true
            prepend: 发表于
          wordcount: # 统计全文字数
            enable: true
            prepend: 总计
            unit: 字
          readtime: # 计算文章阅读时间
            enable: true
            prepend: 阅读时间
            unit: 分
            divided_by: 300 # 正常人的阅读速度大概每分钟三百个字
